<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c1c1e;--sub:#6b7280;--line:#e5e7eb;--blue:#0b57d0;--green:#1b7f3b;--amber:#b26a00;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}header .who{font-size:13px;color:var(--sub)}
main{padding:12px 14px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--sub);font-size:13px}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--blue);color:#fff}.btn.s{border-color:var(--line);color:var(--ink)}.btn.big{display:block;text-align:center;font-size:17px;padding:14px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px;background:#fff;color:var(--ink)}
input[type=number]{font-size:22px;font-weight:600;text-align:center}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--sub)}
.q{display:flex;align-items:center;gap:10px;margin:10px 0}.q label{flex:1;font-size:16px}.q input{width:110px;flex:none}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;background:#eef2ff;color:#3730a3;margin-right:4px}
.tag.green{background:#e6f4ea;color:var(--green)}.tag.amber{background:#fff4e5;color:var(--amber)}
.hit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:10px;align-items:center}
.hit input{width:20px;height:20px;flex:none}.hit b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f8fafc;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--sub)}
details{margin-top:12px}summary{cursor:pointer;color:var(--sub);font-size:14px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:9;pointer-events:none}.toast.on{opacity:.95}
.done{background:#e6f4ea;border-radius:10px;padding:10px 12px;color:var(--green);font-size:14px;margin-bottom:10px}
.foot{font-size:12px;color:var(--sub);text-align:center;padding:8px 0 0}
</style>

const DATEPAT=/^\s*\d{8}\s*$|\d{4}[.\-\/年]\d{1,2}[.\-\/月]\d{1,2}|^\s*\d{4}[.\-\/]\d{1,2}|\d+\s*月(?![薪])|第\s*[一二三四1234]\s*季度|\d{4}年/;
const NEGWORD=/表汇总|汇总表|排期表|模板|待办|草稿/;
function detect(text){
 const out=[];const e0=me();const ks=(e0&&e0.cat==='主播')?[HOURQ].concat(myKpi()):myKpi();const seen={};
 const segs=text.replace(/\s+(?=[0-9]+\s*[.、)）])/g,'\n').split(/[\n;；,，。]/).filter(s=>s.trim());
 segs.forEach(seg=>{
  let seg0=seg.replace(/^\s*[0-9]+\s*[.、)）:：]\s*/,'');
  // 剔除日期片段后再找数字
  const clean=seg0.replace(/\d{8}/g,' ').replace(/\d{4}[.\-\/年]\d{1,2}[.\-\/月]?\d{0,2}/g,' ').replace(/\d+\s*月(?![薪])/g,' ').replace(/第\s*[一二三四1234]\s*季度/g,' ');
  if(NEGWORD.test(seg0))return;
  const nm=clean.match(/(\d+(?:\.\d+)?)\s*(条|场|小时|个|单|户|篇|次|人|份|件)/);
  if(!nm)return;                                  // 必须「数字+单位」,裸数字不认
  const val=parseFloat(nm[1]);const unit=nm[2];
  if(val<=0||val>2000)return;
  const pos=clean.indexOf(nm[0]);
  let best=null,bestScore=0;
  ks.forEach(k=>{
   const kws=(k.kw||'').split(/[,，]/).filter(x=>x.trim());
   let sc=0;
   kws.forEach(w=>{if(!w)return;const at=clean.indexOf(w);if(at<0)return;
    const dist=Math.abs(at-pos);if(dist>25)return;   // 关键词须贴近数字
    sc+=w.length*(dist<=8?2:1);});
   if(sc===0)return;
   if(k.unit&&unit){ if(k.unit===unit)sc+=4; else sc-=2; }   // 单位不符重罚
   if(sc>bestScore){bestScore=sc;best=k;}
  });
  if(best&&bestScore>=1){const key=best.id+'@'+val;if(seen[key])return;seen[key]=1;out.push({id:best.id,name:best.name,unit:best.unit||unit,val:val,seg:seg0.trim(),score:bestScore});}
 });
 return out;
}

function nextNode(){const d=new Date(),day=d.getDate();const ns=[[5,'初评'],[10,'复核'],[15,'签字']];for(const[n,l]of ns){if(day<=n)return{days:n-day,label:l+'截止',day:n};}const nx=new Date(d.getFullYear(),d.getMonth()+1,5);return{days:Math.round((nx-d)/864e5),label:'初评截止',day:5};}
function bind(){document.querySelectorAll('[data-a]').forEach(el=>{const ev=(el.tagName==='INPUT'&&el.type!=='checkbox')||el.tagName==='TEXTAREA'?'input':(el.tagName==='SELECT'||el.type==='checkbox'?'change':'click');el.addEventListener(ev,e=>A[el.dataset.a](el,e));});}
let tt;
const A={
 code:el=>{profile.code=el.value;save('profile',profile);render();},
 v:el=>{draft.vals[el.dataset.id]=el.value;save('draft',draft);},
 text:el=>{draft.text=el.value;save('draft',draft);clearTimeout(tt);tt=setTimeout(()=>{const p=document.activeElement===el?el.selectionStart:null;render();if(p!=null){const n=document.querySelector('textarea[data-a=text]');if(n){n.focus();n.setSelectionRange(p,p);}}},700);},
 hit:el=>{const hits=detect(draft.text);const x=hits[+el.dataset.i];if(!x)return;draft.off=draft.off||{};if(el.checked)delete draft.off[x.id];else draft.off[x.id]=1;save('draft',draft);},
 reset:()=>{profile={code:''};save('profile',profile);render();},
 submit:()=>{
  const e=me();const asks=askList();const hits=detect(draft.text).filter(x=>!(draft.off&&draft.off[x.id]));
  const parts=[];const kv={'日期':today()};
  asks.forEach(k=>{const v=draft.vals[k.id];if(v!==''&&v!=null)parts.push({id:k.id,name:k.name,unit:k.unit,val:parseFloat(v)});});
  hits.forEach(x=>{if(!parts.some(p=>p.id===x.id))parts.push(x);});
  if(!parts.length&&!draft.text.trim()){toast('填一个数字或写一句话再提交');return;}
  const main=parts.filter(p=>p.id!=='HOURS')[0]||parts[0];
  if(main){kv['结果数字']=main.val;kv['单位']=main.unit||'';}
  const desc=(parts.length?parts.map(p=>p.name+' '+p.val+(p.unit||'')).join(';'):'')+(draft.text.trim()?(parts.length?' | ':'')+draft.text.trim():'');
  kv['结果描述']=desc.slice(0,900);
  const idx=parts.map(p=>p.id+'='+p.val).join(',');
  if(idx)kv['临时工作']='[AUTO]'+idx;
  const u=pre(D.forms['T04_每日工作记录'],kv);
  submitted[today()]=parts.length?parts.map(p=>p.name+' '+p.val+(p.unit||'')).join('、'):'一句话';
  save('submitted',submitted);
  const w=window.open(u,'_blank');if(!w)location.href=u;
  toast('已带入表单,点提交即可');setTimeout(render,300);
 }
};
