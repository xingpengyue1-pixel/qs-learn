<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>潜势学习台 V1.0</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c1c1e;--sub:#6b7280;--line:#e5e7eb;--blue:#0b57d0;--red:#c62828;--green:#1b7f3b;--amber:#b26a00;--r:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0;font-weight:600}header .who{font-size:13px;color:var(--sub)}
main{padding:14px 14px calc(76px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--sub)}nav button.on{color:var(--blue);font-weight:600}
nav button i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:16px;margin:0 0 8px}.card h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--sub);font-size:13px}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}.btn.s{border-color:var(--line);color:var(--ink)}.btn.d{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}
label.f{display:block;margin:8px 0 4px;font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:#eef2ff;color:#3730a3;margin-right:4px}
.tag.red{background:#fdecea;color:var(--red)}.tag.green{background:#e6f4ea;color:var(--green)}.tag.amber{background:#fff4e5;color:var(--amber)}
.bar{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:#f8fafc;border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
ul.cl{list-style:none;padding:0;margin:0}ul.cl li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
ul.cl li:first-child{border-top:0}ul.cl input{width:20px;height:20px;margin-top:3px;flex:none}
.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;background:#fff}
.opt.sel{border-color:var(--blue);background:#eef4ff}.opt.ok{border-color:var(--green);background:#e6f4ea}.opt.bad{border-color:var(--red);background:#fdecea}
.exp{background:#f8fafc;border-left:3px solid var(--blue);padding:8px 10px;border-radius:6px;margin-top:8px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}th{color:var(--sub);font-weight:500;font-size:12px}
.kv td:first-child{color:var(--sub);width:38%}
pre{white-space:pre-wrap;word-break:break-all;background:#f8fafc;border-radius:10px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
details{margin:6px 0}summary{cursor:pointer;font-weight:500}
.foot{font-size:12px;color:var(--sub);text-align:center;padding:14px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:9;pointer-events:none}
.toast.on{opacity:.95}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:none;align-items:flex-end}.sheet.on{display:flex}
.sheet>div{background:#fff;width:100%;max-height:80vh;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;border:1px solid var(--line);margin:0 6px 6px 0;font-size:13px;cursor:pointer}.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hide{display:none}
</style>
</head>

<script>
'use strict';
const DATA={"meta":{"title":"潜势学习台","version":"V1.0","date":"2026-09-06","org":"内蒙古潜势科技有限公司","sources":["七岗学习系统 V1.0(2026-08-05)","播前闸 V3.1 两阶段版(2026-07-27)","绩效体系 V1.6(2026-09-06)","AI 办公手册 V1.0 第 0 章","团队执行与成长系统 V2.5"]},"params":{"anchor_hours":90,"offset_cap":27,"tier_full":1.0,"tier_09":0.95,"tier_07":0.7,"ratio_cap":1.2,"perf_share":0.15,"appeal_submit_days":5,"appeal_accept_days":1,"appeal_reply_days":10,"cycle_days":[5,10,15],"similarity":0.8,"d0":"2026-09-07"},"tiers":[["I","经常无法达标","半年内四个月以上 KPI 未达标或红线触发;进入改进期,须有培训与辅导记录","年终奖无;调薪无"],["M-","略低于预期","有投诉记录或连续两月 KPI 未达标;连续两期 M- 触发调岗调薪不解除","年终奖无;调薪无"],["M","所有核心项持续达标","多数人默认档;不排名、不设比例","年终奖固定基数;调薪统一口径"],["M+","持续达标且有时超出","甲方口头认可有记录","年终奖区间;调薪有"],["E","经常超出","甲方书面好评或续约归因","年终奖区间;调薪优先"]],"common":[{"id":"C1","name":"法定义务","tag":"红线","hours":"2h","why":"教学层此前只教平台词表,没教法定义务。词表违反了先封号,法定义务违反了要担责且留不下自证的证据。","know":["令 117 号《直播电商监督管理办法》2025-12-18 公布、<b>2026-02-01 施行<\/b>","第三十条:直播间运营者<b>应当<\/b>建立事前合规审核机制(展示内容/讲解内容/服装/布景/道具),签字件与记录存<b>不少于三年<\/b>","第 28 条:主播身份<b>每次直播前<\/b>报送平台(不是入职报一次)","第 31 条:现场纠错并留痕;第 32 条:价格比较须标明基准","第 25／26 条:主体与销售者信息持续公示,链接不得多次跳转","第 37 条 + <b>GB 45438<\/b>:AI 数字人须标识并<b>持续<\/b>提示","令 120 号《直播电商经营者落实食品安全主体责任监督管理规定》2026-03-20——<b>餐饮是本地生活主战场,这条与我们高度相关<\/b>","市监广发〔2026〕17 号:小字免责专项整治,2026-03-13 起半年(约至 2026 年 9 月)","平台已落地:《生活服务创作者管理总则》2026-02-28 更新,明确纳入令 117／120 号"],"do":["开播前按播前闸 V3.1 走 D-1 段书面审核,产出可存档签字件","每场直播前完成主播身份报送并留截图","讲「原价」「省多少」时同步标明比较基准","涉餐饮团购,核对商家食品经营许可与资质有效期"],"check":"能说出「事前合规审核是<b>法定义务<\/b>而非内部管理动作」,并能指出签字件要存<b>三年<\/b>。答成「审核值班岗有权叫停」即不通过。","trap":"把「有权叫停」当成全部——那是内部管理动作,法条写的是「应当建立机制」。"},{"id":"C2","name":"绝对化用语两步法","tag":"红线","hours":"1.5h","why":"只教词表会两头错:该说的不敢说(有数据可举证的也不敢用,白丢转化),不该做的不知道(词表外无法举证的照样违法)。","know":["<b>第一步判能否举证,第二步才查词表<\/b>","总局公告 2023 年第 6 号<b>第六条<\/b>列六种不适用情形、<b>第七条<\/b>:无法证明真实性的,即使不在词表也予查处","词表是第二步的辅助工具,不是判断依据本身"],"do":["正例:「本月办理量全市第一」+ 限定时间地域 + 有数据支撑 = <b>合规可用<\/b>","反例:「信号最好、网速最快」无国标行标依据 = <b>违法<\/b>","拿不准时问三句:这句话我拿什么证明?证明材料在谁手里?对方要我举证时我几分钟能拿出来?"],"check":"给 5 句话现场判定,须先答「能否举证」再答「在不在词表」。只查词表不判举证的,本项不通过。","trap":"背了八条禁语就以为安全了。八条之外照样能违法,八条之内也可能合规。"},{"id":"C3","name":"三道闸","tag":"流程","hours":"1.5h","why":"闸是流程里唯一能挡住错误的地方。没有闸的流程,错误只会在最贵的环节暴露。","know":["<b>选题闸<\/b>:钩子过硬标准 + 真窗口有原文出处","<b>发布闸<\/b>:信任凭证入镜、无绝对化、无口径外资费、不撞车","<b>数据闸<\/b>:三表回填齐、空字段 >10% 先议","评论区首响 ≤ 30 分钟","触线三字诀「<b>停、核、改<\/b>」——谁先停谁有功,谁硬扛谁担责"],"do":["每条内容过三闸并留痕","触线时先停,不辩论、不硬扛"],"check":"能说出三道闸各防什么,并能指出自己岗位持哪一闸。","trap":"把闸当成审批环节走个形式。闸的价值在「谁先停谁有功」这条激励,不在签字。"},{"id":"C4","name":"线索七态与归因","tag":"数据","hours":"2h","why":"没有编号的内容,数据回不来,酬金算不上。线索状态不清,对账就没有证据。","know":["七态:新线索 → 已联系 → 已确认需求 → 已办理/到厅 → 已出账 → 有效在网 → 可计酬","<b>可计酬须同时满足五项<\/b>","<b>停滞线索标注原因不得删除——删除等于毁掉对账证据<\/b>","归因四优先级:系统 → 编码/二维码/表单 → 客户说明有佐证 → 争议池","内容编号规则:项目线代码-年月日-内容类型-三位序号"],"do":["每条线索标注状态与停滞原因","所有内容发布前先取编号"],"check":"判断题「联系不上的线索可以直接从台账删除」——答错本项不通过。","trap":"为了台账好看删掉停滞线索。删了就再也证明不了这单是你做的。"},{"id":"C5","name":"数据口径三铁律","tag":"数据","hours":"2h","why":"同一个经营问题,换个口径就得出相反结论。口径不统一,数据会议就变成互相质疑。","know":["① <b>意向成交 ≠ 核销<\/b>(下单时点 vs 到店时点),跨周期须同窗口对齐,否则核销率会 >100%","② 核销转化率必须<b>券口径与金额口径并排出<\/b>,四象限判读:券高额低=高客单滞销;券低额高=低价大量退款","③ 客单价必须<b>原始金额 ÷ 原始人数<\/b>复算,禁「平均的平均」;退款率 >30% 告警","母案例实证:校园卡核销率<b>券口径 12%、金额口径 18%<\/b>——一个像重灾区一个像正常,谁都没说错"],"do":["出任何一张数据表,先写清口径与时间窗","看到核销率 >100% 立刻查窗口对齐"],"check":"给一组券口径/金额口径背离的数据,能判出属于哪个象限并说出对应动作。","trap":"拿「支付 GMV」当「核销 GMV」讲。<b>平台核销率约 50%(2025 年核销 GMV 约 4000 亿 vs 支付 8500 亿)<\/b>,差的一半是不存在的业绩。"},{"id":"C6","name":"5 段元结构与金句公式","tag":"内容","hours":"2.5h","why":"经验在文件里而不在脑子里。范式库让新人第一天就能用上老手的结构。","know":["5 段元结构:段落结构 / 范式库 / 公式集 / 多样性约束 / 风格约束。总判据「这件事一年做 ≥10 次吗?」","范式库三标签:适用 / 不适用 / 已验证样本","<b>金句五公式 F1<\/b>:A 不是 X 是 Y / 不要 X 要 Y / X 之前先 Y / X 之外有 Y / X＝Y","字数按用途分档:<b>对外 12-18 字,对内方法论 8-18 字<\/b>(V3.8 实战修正)","出稿闸写死为:F1 → 顺口判据 → <b>F16 金句四特征 ≥3 分<\/b> → D11 → S1","5 段脚本结构:钩子/场景/价值/证明/行动 + 单点原则「一条视频,一个人群,一个信息,一个动作」","短视频四段时间骨架:钩子 0-3s / 信息 3-30s / 转折 30-45s / CTA 45-60s"],"do":["写完金句先过 F16 四特征打分,低于 3 分重写","每周反向沉淀 ≥1 条入范式库"],"check":"现场写 3 条金句,须命中五公式之一且 F16 ≥3 分,字数按用途分档达标。","trap":"F1.5「X＝Y」最易写成操作说明,不是金句。"},{"id":"C7","name":"运营四问","tag":"方法","hours":"2h","why":"判断一个方案值不值得做,不看创意看四个问题。顺序不可颠倒——媒介不解决后三问无意义,承接不解决前两问做得越好死得越快。","know":["<b>一问媒介<\/b>:我们的场是只读还是可写?顾客有没有一个<b>只有他能完成的动作<\/b>?答不出=在买曝光不是做运营","<b>二问话语权<\/b>:准备让渡什么?允许别人拿我们的符号讲与我们无关的事?答不出=只有广告没有模因","<b>三问承接<\/b>:位移成本多少?这需求能不能在他家楼下被满足?答不出=在给替代供给做嫁衣","<b>四问验证<\/b>:谁能来验证?验证过程扛不扛得住?答不出=在自说自话","只读媒介(电梯/传单/传统柜台)投进去的是<b>广告<\/b>,成本随曝光线性涨;可写媒介投进去的是<b>素材<\/b>,成本随参与非线性降"],"do":["任何方案开工前先过四问,四问答不齐不开工","写方案时把四问的答案写进正文,不写在脑子里"],"check":"给一个真实方案,能逐条答出四问并指出最弱的一问。","trap":"把四问当成检查表勾一遍。每一问都必须答出<b>具体动作<\/b>,答不出具体动作等于没答。"},{"id":"C8","name":"本地生活行业底数","tag":"认知","hours":"1.5h","why":"对甲方讲话要有数,但数错了比没数更糟。本项全部数字均标来源与定级,引用时必须带来源。","know":["2025 抖音生活服务支付 GMV <b>超 8500 亿<\/b>、同比 <b>+59%<\/b>(雷峰网 2026-02-25,A)","🔴 <b>2026 年初目标 50%,上半年同比增长超 50% 已超额完成,平台于年中上调全年目标<\/b>(36 氪独家 2026-08-03,A)——<b>不讲「已换挡」<\/b>","核销率约 <b>50%<\/b>,核销 GMV 约 4000 亿;美团 80%-90%。⚠ <b>核销率品类离散度极大,酒旅不到 30%,不得跨品类套用一个数<\/b>","货补:普通城市约 4%,进攻城市 6%-7.5%,头部商户最高 10%;Bigday 货补为平时 2-3 倍","抖音团购一级入口 19 类 vs 美团 25 类","🆕 <b>抖省省<\/b>独立 App:无短视频无直播的纯团购货架,日活破 1500 万(平台口径转述),对中小商家是「免内容入场券」——<b>这是与内容通道并列的第二条通道<\/b>"],"do":["对甲方引用任何数字,同时说出来源与年份","遇到没把握的数字,说「这个我回去核」而不是估一个"],"check":"能说出「支付 GMV ≠ 核销 GMV」的差额量级,并能指出核销率不能跨品类套用。","trap":"把 8500 亿说成核销额;把 50% 核销率安到餐饮/酒旅任一具体品类上。"}],"roles":[{"id":"R1","name":"运营统筹","icon":"◈","weeks":"3-4 周","one":"把线拉起来,并对三表齐套负责。","own":"持<b>选题闸<\/b>与<b>数据闸<\/b>(第 1、3 闸)","kpi":"三表齐套率 ≥ 90%","skills":[{"n":"八环节排产","know":"选题→策划→拍摄→剪辑→发布→复盘,支线直播→承接。每个环节的交付物与时限写死","do":"出周排产表,标明每环节责任人与卡点","check":"能画出八环节泳道并指出本周卡在哪一环"},{"n":"三表管理","know":"内容表/线索表/结算表三表对应,空字段 >10% 先议","do":"每周核三表齐套率,不齐先停发布","check":"三表齐套率 ≥90% 且能说出不齐的原因分布"},{"n":"持闸","know":"选题闸防没出处/钩子不硬;数据闸防回填不齐","do":"闸不过不放行,放行留痕","check":"能举出本月自己挡下的一条,并说明依据"},{"n":"RACI 与升级","know":"「我是 R 还是 A?动手前问谁?干完告诉谁?」A 每行唯一","do":"每个任务标 RACI,A 不能有两个","check":"给一张任务表,能指出 A 重复的行"},{"n":"复盘五维","know":"有效咨询/核销/业务/合规/训练价值——<b>不唯播放量<\/b>","do":"每周出五维复盘,播放量只作参考列","check":"复盘里播放量不出现在结论句中"}],"red":["三表不齐仍放行发布","为了数据好看删停滞线索","用播放量向甲方汇报成果"],"err":"把统筹做成催稿。统筹的价值在闸和口径,不在提醒别人交作业。"},{"id":"R2","name":"编导","icon":"✎","weeks":"3-4 周","one":"找到真窗口,并在 24 小时内把它变成能拍的脚本卡。","own":"选题的出处责任","kpi":"24h 脚本卡交付率;选题闸一次通过率","skills":[{"n":"选题四来源","know":"客户高频问题 / 门店场景 / 商家权益 / 法治主题;立项四步","do":"每条选题写明来源与原文出处链接","check":"抽查 5 条选题,均能出示出处"},{"n":"真窗口判据","know":"真窗口=有时间边界、有原文出处、有可核验事实。没出处的热点不做","do":"选题卡必填「窗口起止日 + 出处」","check":"能当场判掉一个无出处的伪窗口"},{"n":"5 段脚本","know":"钩子/场景/价值/证明/行动;单点原则:一条视频一个人群一个信息一个动作","do":"24h 内出脚本卡,含分镜与口播字数","check":"脚本能被拍摄岗直接执行,无需二次追问"},{"n":"金句出稿闸","know":"F1 五公式 → 顺口判据 → F16 ≥3 分 → D11 → S1","do":"每条脚本配 1 条主金句并附打分","check":"F16 打分 ≥3 分,字数按用途分档达标"},{"n":"多样性约束","know":"同公式 ≤2、任一子范式 ≤35%、行政区均衡(每区每月 ≥8 条)","do":"月度自查公式与范式分布","check":"能出示本月分布表且无单项超限"}],"red":["无出处的热点选题","一条视频塞两个动作","为了顺口写出无法举证的绝对化表述"],"err":"把选题做成蹭热点。真窗口的判据是<b>能不能拿出原文<\/b>,不是热不热。"},{"id":"R3","name":"拍摄","icon":"▣","weeks":"3 周","one":"一次进场,拿够四种格式的料,并且把信任凭证拍进画面。","own":"信任凭证入镜","kpi":"一次进场四格式达成率;补拍率","skills":[{"n":"拍摄前六检","know":"六检清单(场地/光/声/证照/道具/授权)","do":"进场前逐项打钩,缺一项不开机","check":"能背出六检并说明缺哪项会导致整条废掉"},{"n":"一次进场四格式","know":"一鱼四吃:抖音快剪/视频号慢版/小红书图文/朋友圈四格式,<b>四件齐才算 1 单<\/b>","do":"同一次拍摄按四种构图分别取素材","check":"单次进场产出四格式可用素材,补拍率 <10%"},{"n":"信任凭证入镜","know":"营业执照、授权书、蓝V标识、价格公示牌等须自然入镜","do":"每条至少一处凭证清晰可辨","check":"抽查成片,凭证可辨识"},{"n":"参数落地","know":"机位 1.2-1.5 米眼平;收音 ≤50 厘米;导出 1080p/30 帧","do":"现场用参数卡核对","check":"成片参数达标"},{"n":"肖像与版权","know":"出镜须书面肖像授权;音乐素材须版权自查;AI 生成须标注","do":"授权书当场签,不事后补","check":"每条出镜内容均有对应授权件"}],"red":["无授权出镜","商用音乐未核版权","凭证入镜但模糊到无法辨认(等于没拍)"],"err":"只拍主机位。四格式的构图差异必须在<b>拍的时候<\/b>解决,剪辑救不回来。"},{"id":"R4","name":"剪辑","icon":"✂","weeks":"3 周","one":"24 小时内把一次拍摄变成四件成品。","own":"一鱼四吃的产出效率","kpi":"24h 出四件达成率","skills":[{"n":"字幕五规范","know":"每行 ≤15 字;人声 100%、BGM 20-30%;关键数字必上屏","do":"按规范卡逐条核","check":"抽查成片,五项规范全达标"},{"n":"一鱼四吃转制","know":"四格式的时长/比例/节奏差异;竖屏率不足时走<b>模糊衬底不走中心裁切<\/b>(裁切会切掉牌匾等凭证)","do":"同素材四版本并行导出","check":"24h 内四件齐"},{"n":"四段时间骨架","know":"钩子 0-3s / 信息 3-30s / 转折 30-45s / CTA 45-60s","do":"剪辑前先在时间轴上打四个标记点","check":"成片四段边界清晰,钩子在 3 秒内出现"},{"n":"AI 痕迹与风格","know":"AI 生成内容须标注;风格漂移 >10% 重培训","do":"AI 配音/文案/海报一律标注「AI 生成」","check":"AI 内容标注齐全"},{"n":"发布前自检","know":"无绝对化、无口径外资费、凭证可辨、编号已取","do":"四项自检后交平台运营","check":"退回率 <10%"}],"red":["中心裁切切掉信任凭证","AI 内容不标注","为赶时间跳过发布前自检"],"err":"把四件做成一件的四种尺寸。四格式的<b>叙事节奏<\/b>不同,不只是画幅不同。"},{"id":"R5","name":"平台运营","icon":"◎","weeks":"3 周","one":"守发布闸,并让每一条内容在正确的时间出现在正确的位置。","own":"持<b>发布闸<\/b>(第 2 闸)","kpi":"发布准时率;评论区首响 ≤30 分钟","skills":[{"n":"发布闸五查","know":"信任凭证入镜 / 无绝对化 / 无口径外资费 / 不撞车 / 编号已取","do":"五查不过不发,退回并注明原因","check":"能举出本月退回的具体条目与依据"},{"n":"定时与排布","know":"按内容日历定时发布;同类目不撞车","do":"周排布表提前 3 天锁定","check":"发布准时率 ≥95%"},{"n":"评论区经营","know":"首响 ≤30 分钟;控负面三步:先共情 → 转移焦点 → 福袋止血","do":"值班表覆盖发布后 2 小时","check":"首响达标率 ≥90%"},{"n":"平台规则跟踪","know":"🔴 <b>规则保鲜期以周计,不适用「六个月复核」<\/b>。lifexue.com 规则中心须<b>月度巡检<\/b>,公示期内规则记入「待生效」清单","do":"每月巡检一次并出变更清单","check":"能说出本月新生效或公示中的规则至少一条"},{"n":"账号健康","know":"违禁词累计 3 次触发黑名单;退货率/举报率/差评率有一票否决权","do":"周查账号健康分","check":"无违规累计"}],"red":["为赶发布跳过五查","评论区放任负面过夜","用谐音梗/缩写规避审核(<b>教规避＝教违规<\/b>)"],"err":"把平台运营做成发布工具人。这个岗真正的价值是<b>规则跟踪<\/b>——规则变了没人知道,全线都在裸奔。"},{"id":"R6","name":"主播 / 助播","icon":"◐","weeks":"4 周","one":"在合规边界之内把转化做出来。","own":"开播 12 检 + 现场合规","kpi":"场均有效咨询数;红线零触发","skills":[{"n":"开播前两阶段","know":"🔴 播前闸 V3.1 <b>两阶段共 77 项、一票否决 44 项<\/b>:D-1 开播前一日 32 项(书面审核+资质+主体公示+身份核验)/ 开播日 39 项 / T+60 收口 6 项。<b>D-1 未放行不得进开播日<\/b>","do":"两阶段逐项签字,签字件存三年","check":"能说出 D-1 与开播日的分界依据(事前审核必须「事前」)"},{"n":"黄金 30 秒","know":"三句法:身份句 → 钩子句 → 行动句;「蓝V可查」亮身份。对镜重复 50 遍","do":"每场开播前空播 3 遍","check":"30 秒内三句齐,身份可核验"},{"n":"FABE 与利益点","know":"特征→优势→利益→证据;资费翻译成人均/天(「79 元÷3 人=27 元」脱口而出);利益点句式数字一律 {} 占位,开播前替换","do":"话术卡占位符开播前逐个替换并复核","check":"占位符零残留,资费口径与系统一致"},{"n":"异议索引化","know":"<b>异议不是背话术,是建索引<\/b>。13 类未办理原因 × 优先级 × 编号 OB-{缩写}-{序号};D 级不跟进(外地/超龄/未成年)","do":"遇新异议当场记录并回填索引","check":"能按编号调出对应答法"},{"n":"六阶段流与逼单","know":"开场→升温→飙升→衰减→稳定→结束,<b>在线人数曲线决定话术策略而非商品目录<\/b>;逼单三件套:真实稀缺+损失厌恶+兜底承诺(须真实可兑现)","do":"看曲线换话术,不照着排品表念","check":"能根据一张曲线图说出该用哪段话术"}],"red":["逼单话术承诺无法兑现的稀缺或兜底","口播未公示的资费","D-1 未放行强行开播"],"err":"把直播当成念稿。<b>六阶段流的意思是,同一件商品在不同人数下要用不同讲法。<\/b>"},{"id":"R7","name":"中控 / 投流","icon":"▲","weeks":"3-4 周","one":"只给已经被验证过的素材加热,并每 15 分钟记一次数。","own":"投放决策与止损","kpi":"单核销成本;止损纪律执行率","skills":[{"n":"15 分钟记数","know":"每 15 分钟记一次关键数,不靠回忆复盘","do":"记数表现场填,不事后补","check":"记数表连续无断点"},{"n":"只加热过基准素材","know":"<b>未达自然流基准的素材不投<\/b>——投流放大的是素材本身的转化率,烂素材加热只会更快烧钱","do":"先看自然流表现,达标才投","check":"能说出自己上次拒绝加热的素材和原因"},{"n":"六层漏斗定位","know":"L1 流量入口 → L2 进房 → L3 互动 → L4 转化 → L5 O2O 履约(运营商特有:外呼触达→预约→到店→核销) → L6 场次主播维度。<b>每层跌破目标值一半处＝本周唯一要修处<\/b>","do":"每周只指出一处并修它","check":"能用漏斗定位出本周唯一要修的一层"},{"n":"🔴 基准值的正确用法","know":"六层各层目标值(曝光→点击 ≥5%、点击→进房 ≥80%、停留≥60s 占比 ≥40%、商品点击 ≥15%、下单 ≥3%、支付 ≥95%、外呼触达 ≥85%、<b>预约转化 ≥60%<\/b>、到店履约 ≥80%)全部是<b>母案例手册口径＝内部经验值,非行业基准<\/b>;且<b>品类差异必须单列,不能用统一基准考核<\/b>","do":"对甲方或对学员引用时必须标明「内部经验值」","check":"能说出这组数字不是行业基准,且能举出品类离散的例子(酒旅核销率不到 30%)"},{"n":"止损与退款倒挂","know":"退款倒挂六段式:问题定义(<b>不是没成交,是落不了袋<\/b>)→数据支撑→根因→分级预案(止血→增收→重配,<b>不可乱序<\/b>)→KPI(只设 3 条带起止值)→数据补齐","do":"退款率 >30% 立即告警并走六段式","check":"能按顺序说出六段,且知道预案不可乱序"}],"red":["加热未达基准的素材","用统一核销率基准考核不同品类","把内部经验值当行业基准对外引用"],"err":"把投流当成买量。<b>投流是放大器不是发动机<\/b>,它只会把已有的转化率放大,包括负的。"}],"role8":{"name":"客资回访(第 8 岗)","text":"挂客资 SOP:11 字段 / 4 维评分 / 三轮逼单。本岗不单独设学习路径,由运营统筹与主播岗兼任;🔴 红线:<b>真实手机号不进微信云端<\/b>,客资永不经爬虫。线索七态与归因规则见公共基础 C4。"},"quiz":[{"scope":"common","topic":"C1","type":"judge","q":"开播前的合规审核属于公司内部管理动作,做不做由直播间自己决定。","a":false,"exp":"错。令 117 号第三十条写的是「<b>应当<\/b>建立事前合规审核机制」,是<b>法定义务<\/b>,且签字件与记录须存不少于三年。"},{"scope":"common","topic":"C1","type":"single","q":"《直播电商监督管理办法》(令 117 号)的施行日期是:","opts":["2025-12-18","2026-01-01","2026-02-01","2026-03-20"],"a":2,"exp":"2025-12-18 是公布日,<b>2026-02-01 施行<\/b>。2026-03-20 是令 120 号食品安全主体责任规定。"},{"scope":"common","topic":"C1","type":"single","q":"主播身份向平台报送的频次要求是:","opts":["入职时报一次","每月报一次","每次直播前报送","仅更换主播时报送"],"a":2,"exp":"令 117 号第 28 条:<b>每次直播前<\/b>报送。"},{"scope":"common","topic":"C1","type":"multi","q":"下列哪些属于令 117 号明确的法定义务?","opts":["事前合规审核并留存三年","现场纠错并留痕","价格比较须标明基准","AI 数字人标识并持续提示"],"a":[0,1,2,3],"exp":"分别对应第 30、31、32、37 条,四项全是。"},{"scope":"common","topic":"C1","type":"red","q":"你负责的餐饮团购直播,商家把食品经营许可证给你看了照片,但你没核有效期就开播了。","a":"违规","exp":"🔴 一票否决。令 120 号《直播电商经营者落实食品安全主体责任监督管理规定》(2026-03-20)要求核验资质,<b>餐饮是本地生活主战场,这条与我们高度相关<\/b>。"},{"scope":"common","topic":"C2","type":"judge","q":"只要一句话不在违禁词表里,就可以放心使用。","a":false,"exp":"错。总局公告 2023 年第 6 号第七条:<b>无法证明真实性的,即使不在词表也予查处<\/b>。判据是能否举证。"},{"scope":"common","topic":"C2","type":"single","q":"「本月办理量全市第一」这句话:","opts":["绝对禁用,属绝对化用语","加限定时间地域且有数据支撑时合规可用","只要不写「第一」两字就行","须经平台审核后方可使用"],"a":1,"exp":"总局公告 2023 年第 6 号第六条列有不适用情形。<b>判据是能否举证<\/b>,不是词表。"},{"scope":"common","topic":"C2","type":"single","q":"「我们信号最好、网速最快」这句话的问题在于:","opts":["用了「最」字","无国标行标依据,无法举证","没有加限定词","应改成「信号很好」"],"a":1,"exp":"核心问题是<b>无法证明真实性<\/b>。改成「很好」也一样无法举证。"},{"scope":"common","topic":"C2","type":"red","q":"为了通过审核,你把「全网最低价」写成了「全网 zui 低价」。","a":"违规","exp":"🔴 一票否决。严打谐音梗/缩写规避审核,<b>教规避＝教违规<\/b>。"},{"scope":"common","topic":"C3","type":"multi","q":"发布闸要防的是:","opts":["信任凭证未入镜","出现绝对化表述","出现口径外资费","与同类目内容撞车"],"a":[0,1,2,3],"exp":"四项均为发布闸内容。"},{"scope":"common","topic":"C3","type":"single","q":"触线三字诀「停、核、改」中,激励设计的关键在于:","opts":["谁停得快谁受罚轻","谁先停谁有功,谁硬扛谁担责","停了要写检查","由主管决定停不停"],"a":1,"exp":"闸的价值在这条激励,不在签字。"},{"scope":"common","topic":"C3","type":"single","q":"评论区首响的时限要求是:","opts":["≤10 分钟","≤30 分钟","≤2 小时","当日回复即可"],"a":1,"exp":"≤30 分钟。"},{"scope":"common","topic":"C4","type":"judge","q":"联系不上的线索可以直接从台账删除,以免影响转化率。","a":false,"exp":"错。<b>停滞线索标注原因不得删除——删除等于毁掉对账证据<\/b>。"},{"scope":"common","topic":"C4","type":"single","q":"线索七态中「已确认需求」之后的第 4 态是:","opts":["已出账","已办理/到厅","有效在网","可计酬"],"a":1,"exp":"七态顺序:新线索→已联系→已确认需求→<b>已办理/到厅<\/b>→已出账→有效在网→可计酬。"},{"scope":"common","topic":"C4","type":"single","q":"归因优先级最高的是:","opts":["客户口头说明","编码/二维码/表单","系统","争议池"],"a":2,"exp":"系统 → 编码/二维码/表单 → 客户说明有佐证 → 争议池。"},{"scope":"common","topic":"C5","type":"judge","q":"核销率算出来是 112%,说明这个月核销超预期,是好事。","a":false,"exp":"错。核销率 >100% 说明<b>跨周期窗口没对齐<\/b>(下单时点 vs 到店时点),是口径错误不是业绩。"},{"scope":"common","topic":"C5","type":"single","q":"券口径核销率高但金额口径低,通常意味着:","opts":["低价大量退款","高客单滞销","数据采集错误","核销正常无需处理"],"a":1,"exp":"券高额低=<b>高客单滞销<\/b>;券低额高=低价大量退款。"},{"scope":"common","topic":"C5","type":"single","q":"抖音生活服务 2025 年支付 GMV 超 8500 亿,其对应的核销 GMV 约为:","opts":["8500 亿","6000 亿","4000 亿","2000 亿"],"a":2,"exp":"核销 GMV 约 <b>4000 亿<\/b>,核销率约 50%。<b>支付 GMV ≠ 核销 GMV<\/b> 是本课程必考点。"},{"scope":"common","topic":"C5","type":"multi","q":"关于核销率,下列说法正确的是:","opts":["平台整体约 50%","美团 80%-90%","可以用一个统一基准考核所有品类","酒旅品类曾低至不到 30%"],"a":[0,1,3],"exp":"第三项错。<b>核销率品类离散度极大,不得跨品类套用同一个数<\/b>。"},{"scope":"common","topic":"C6","type":"single","q":"金句字数的正确口径是:","opts":["一律 12-18 字","一律 8-18 字","对外 12-18 字,对内方法论 8-18 字","无字数要求"],"a":2,"exp":"V3.8 实战修正后按用途分档。"},{"scope":"common","topic":"C6","type":"single","q":"出稿闸的正确顺序是:","opts":["F16→F1→D11→S1","F1→顺口判据→F16≥3分→D11→S1","D11→F1→F16→S1","S1→F1→F16→D11"],"a":1,"exp":"出稿闸写死为此顺序。"},{"scope":"common","topic":"C6","type":"single","q":"短视频四段时间骨架中,钩子应出现在:","opts":["0-3 秒","3-10 秒","前 15 秒","无硬性要求"],"a":0,"exp":"钩子 0-3s / 信息 3-30s / 转折 30-45s / CTA 45-60s。"},{"scope":"common","topic":"C6","type":"judge","q":"「一鱼四吃」指一次拍摄产出四种格式,四件齐才算 1 单。","a":true,"exp":"对。抖音快剪/视频号慢版/小红书图文/朋友圈四格式。"},{"scope":"common","topic":"C7","type":"single","q":"运营四问中,顺序不可颠倒的原因是:","opts":["按重要性排序","媒介不解决后三问无意义,承接不解决前两问做得越好死得越快","按执行难度排序","便于记忆"],"a":1,"exp":"天水就是二问做到了、三问没做——传播成功但生意没成。"},{"scope":"common","topic":"C7","type":"single","q":"「一问媒介」真正要回答的是:","opts":["投在哪个平台","预算多少","顾客有没有一个只有他能完成的动作","内容做得好不好"],"a":2,"exp":"答不出这个动作是什么,说明你在买曝光不是做运营。"},{"scope":"common","topic":"C7","type":"multi","q":"下列属于「只读媒介」的是:","opts":["电梯广告","传统营业厅柜台","抖音评论区","传单"],"a":[0,1,3],"exp":"评论区是可写媒介。只读媒介投进去的是广告,可写媒介投进去的是素材。"},{"scope":"common","topic":"C8","type":"judge","q":"抖音生活服务 2026 年的增速目标是 50%,市场已经换挡放缓。","a":false,"exp":"错。50% 是<b>年初目标<\/b>,2026 上半年同比增长超 50% 已超额完成,<b>平台于年中上调全年目标<\/b>(36 氪 2026-08-03)。不讲「已换挡」。"},{"scope":"common","topic":"C8","type":"single","q":"抖音生活服务的货补,进攻城市通常为:","opts":["约 4%","6%-7.5%","10% 以上","无货补"],"a":1,"exp":"普通城市约 4%,进攻城市 6%-7.5%,头部商户最高 10%。"},{"scope":"common","topic":"C8","type":"single","q":"关于「抖省省」,下列说法正确的是:","opts":["是抖音主端的一个频道","是无短视频无直播的独立团购货架 App","只面向连锁品牌","已停止运营"],"a":1,"exp":"2026 春节上线的独立 App,日活破 1500 万(平台口径转述),对中小商家是「免内容入场券」,是与内容通道并列的<b>第二条通道<\/b>。"},{"scope":"R1","type":"single","q":"运营统筹岗持哪两道闸?","opts":["选题闸与发布闸","选题闸与数据闸","发布闸与数据闸","三闸全持"],"a":1,"exp":"第 1、3 闸。发布闸在平台运营岗。"},{"scope":"R1","type":"single","q":"三表齐套率的目标值是:","opts":["≥70%","≥80%","≥90%","100%"],"a":2,"exp":"≥90%。"},{"scope":"R1","type":"judge","q":"RACI 中一个任务可以有两个 A。","a":false,"exp":"错。<b>A 每行唯一<\/b>,两个 A 等于没有 A。"},{"scope":"R1","type":"multi","q":"五维复盘包含:","opts":["有效咨询","核销","播放量","合规","训练价值"],"a":[0,1,3,4],"exp":"五维=有效咨询/核销/业务/合规/训练价值,<b>不唯播放量<\/b>。"},{"scope":"R1","type":"red","q":"本周三表未齐(空字段 15%),但甲方催得急,你决定先发布后补数据。","a":"违规","exp":"🔴 数据闸规定空字段 >10% 先议。先发后补的结果是数据永远补不回来。"},{"scope":"R2","type":"single","q":"判断「真窗口」的核心判据是:","opts":["热度够不够高","有没有原文出处","竞品做没做过","甲方喜不喜欢"],"a":1,"exp":"真窗口=有时间边界+有原文出处+有可核验事实。<b>没出处的热点不做<\/b>。"},{"scope":"R2","type":"single","q":"脚本单点原则是:","opts":["一条视频一个卖点","一条视频一个人群一个信息一个动作","一条视频不超过三个信息","一条视频只讲一款产品"],"a":1,"exp":"四个「一个」。"},{"scope":"R2","type":"multi","q":"选题的四类真实来源包括:","opts":["客户高频问题","门店场景","商家权益","法治主题"],"a":[0,1,2,3],"exp":"四类全是。"},{"scope":"R2","type":"single","q":"多样性约束中,任一子范式的占比上限是:","opts":["≤25%","≤35%","≤50%","无限制"],"a":1,"exp":"同公式 ≤2、任一子范式 ≤35%、行政区均衡每区每月 ≥8 条。"},{"scope":"R2","type":"red","q":"某热点很火但查不到原文出处,你判断「大家都在发应该没问题」,于是立项了。","a":"违规","exp":"🔴 选题闸要求真窗口有原文出处。「大家都在发」不是出处。"},{"scope":"R3","type":"single","q":"「一次进场四格式」中,四件齐的含义是:","opts":["拍四条视频","一次拍摄产出抖音/视频号/小红书/朋友圈四种格式素材","四个机位","四个人出镜"],"a":1,"exp":"四件齐才算 1 单。"},{"scope":"R3","type":"single","q":"机位高度的标准是:","opts":["0.8-1.0 米","1.2-1.5 米眼平","1.6-1.8 米","无要求"],"a":1,"exp":"1.2-1.5 米眼平;收音 ≤50 厘米。"},{"scope":"R3","type":"judge","q":"信任凭证只要拍进画面就算达标,清不清楚不重要。","a":false,"exp":"错。<b>凭证入镜但模糊到无法辨认等于没拍<\/b>。"},{"scope":"R3","type":"red","q":"门店老板同意出镜,口头说「随便拍」,你就开机了,没签授权书。","a":"违规","exp":"🔴 出镜须<b>书面<\/b>肖像授权,且须当场签不事后补。"},{"scope":"R4","type":"single","q":"字幕每行字数上限是:","opts":["≤10 字","≤15 字","≤20 字","无限制"],"a":1,"exp":"每行 ≤15 字;人声 100%、BGM 20-30%。"},{"scope":"R4","type":"single","q":"横屏素材转竖屏时,正确做法是:","opts":["中心裁切","模糊衬底","拉伸变形","直接加黑边"],"a":1,"exp":"<b>走模糊衬底不走中心裁切<\/b>——裁切会切掉牌匾等信任凭证。"},{"scope":"R4","type":"judge","q":"AI 生成的配音和文案,只要听不出来就不用标注。","a":false,"exp":"错。AI 生成内容<b>一律标注「AI 生成」<\/b>。"},{"scope":"R4","type":"red","q":"为赶 24 小时时限,你跳过发布前四项自检直接交给平台运营。","a":"违规","exp":"🔴 自检是剪辑岗的交付条件之一。跳过自检等于把风险推给下游。"},{"scope":"R5","type":"single","q":"平台规则的复核节律应当是:","opts":["每半年一次","每季度一次","每月巡检一次","规则变了自然会通知"],"a":2,"exp":"🔴 <b>规则保鲜期以周计,不适用「六个月复核」<\/b>。须月度巡检 lifexue.com 规则中心,公示期内规则记入「待生效」清单。"},{"scope":"R5","type":"single","q":"违禁词累计多少次触发黑名单?","opts":["1 次","3 次","5 次","10 次"],"a":1,"exp":"3 次。"},{"scope":"R5","type":"multi","q":"控负面三步是:","opts":["先共情","转移焦点","福袋止血","直接删评"],"a":[0,1,2],"exp":"删评不是三步之一,且容易激化。"},{"scope":"R5","type":"red","q":"某条内容资费与系统口径不一致,但已经排期到今晚,你决定先发再改。","a":"违规","exp":"🔴 发布闸五查含「无口径外资费」。一条 12300／工信部投诉即可导致甲方切割并索赔。"},{"scope":"R6","type":"single","q":"播前闸 V3.1 的两阶段分界依据是:","opts":["按时间早晚","按重要性","事前审核必须「事前」,能不能在现场解决","按岗位分工"],"a":2,"exp":"上架过审、资质索材、资费公示、成本审批都依赖外部响应,压到临播前不叫事前审核。"},{"scope":"R6","type":"single","q":"播前闸 V3.1 共多少项、一票否决多少项?","opts":["59 项/32 项","72 项/40 项","77 项/44 项","100 项/50 项"],"a":2,"exp":"两阶段共 77 项,一票否决 44 项。D-1 段 32 项 / 开播日 39 项 / T+60 收口 6 项。"},{"scope":"R6","type":"single","q":"黄金 30 秒三句法的顺序是:","opts":["钩子句→身份句→行动句","身份句→钩子句→行动句","行动句→身份句→钩子句","身份句→行动句→钩子句"],"a":1,"exp":"身份句亮「蓝V可查」,再钩子,再行动。"},{"scope":"R6","type":"single","q":"直播六阶段流对话术策略的含义是:","opts":["按排品表顺序讲","在线人数曲线决定话术策略","按时间平均分配","由中控决定"],"a":1,"exp":"<b>同一件商品在不同人数下要用不同讲法<\/b>,不是照着排品表念。"},{"scope":"R6","type":"judge","q":"异议处理的核心是把 13 类话术背熟。","a":false,"exp":"错。<b>异议不是背话术,是建索引<\/b>——按「未办理原因→话术编号」映射调取。"},{"scope":"R6","type":"red","q":"直播中你说「这个套餐今晚最后 100 个名额,过时恢复原价」,但实际没有名额限制。","a":"违规","exp":"🔴 逼单三件套的「真实稀缺」必须<b>真实可兑现<\/b>。虚假紧迫属价格欺诈方向,处罚实证 3 万-560 万。"},{"scope":"R7","type":"single","q":"投流的正确定位是:","opts":["发动机,能造出转化","放大器,只放大素材已有的转化率","保底工具,自然流不行就投","越早投越好"],"a":1,"exp":"<b>投流是放大器不是发动机<\/b>,烂素材加热只会更快烧钱。"},{"scope":"R7","type":"single","q":"六层漏斗的正确用法是:","opts":["每层都优化","每周只指出并修一处(跌破目标值一半处)","只看最后一层","按层级顺序逐层优化"],"a":1,"exp":"六层的意义不是全都优化,是每周只指出一处。"},{"scope":"R7","type":"single","q":"六层漏斗中「≥60%」对应的指标是:","opts":["核销率","预约转化","进房率","支付成功率"],"a":1,"exp":"🔴 是<b>预约转化 ≥60%<\/b>,不是核销率。此前教材曾把它误写成「核销率 ≥60%」并错误归因给第三方,已于 2026-08-05 全量勘误。"},{"scope":"R7","type":"multi","q":"关于六层漏斗的各层目标值,正确的是:","opts":["是母案例手册口径的内部经验值","是行业公认基准","品类差异必须单列不能统一考核","对外引用时须标明来源性质"],"a":[0,2,3],"exp":"第二项错。这组数字<b>不是行业基准<\/b>,对甲方或学员引用时必须标明「内部经验值」。"},{"scope":"R7","type":"single","q":"退款倒挂六段式中,分级预案的正确顺序是:","opts":["增收→止血→重配","止血→增收→重配","重配→止血→增收","可根据情况调整顺序"],"a":1,"exp":"止血→增收→重配,<b>不可乱序<\/b>。"},{"scope":"R7","type":"red","q":"某条素材自然流表现未达基准,但甲方希望今晚就起量,你直接加了投放。","a":"违规","exp":"🔴 只加热过基准素材。未达基准就投,等于用预算给一个已知失败的素材买更多失败。"},{"scope":"system","topic":"S1","type":"single","q":"公司现行制度中,浮动绩效占综合薪资的比例是:","opts":["10%","15%","20%","30%"],"a":1,"exp":"工资标准写正式岗综合薪资 = 基础 85% + 绩效 15% + 全勤奖;本系统按 15% 挂钱。"},{"scope":"system","topic":"S1","type":"single","q":"主播岗每月「基础直播时长」的口径是:","opts":["60 小时","80 小时","90 小时","120 小时"],"a":2,"exp":"V1.4 按用户答复定为每月不少于 90 小时。"},{"scope":"system","topic":"S1","type":"single","q":"经批准的支援任务可折抵直播时长,每月折抵上限是:","opts":["9 小时","18 小时","27 小时","不设上限"],"a":2,"exp":"D13 拍板:折抵上限 30%,即 27 小时/月;须事前批准、按实际工时计。"},{"scope":"system","topic":"S1","type":"single","q":"直播时长达成率 96% 时,当月绩效发放比例取:","opts":["1.0","0.9","0.7","待定"],"a":1,"exp":"取档:≥100% 为 1.0,≥95% 为 0.9,≥70% 为 0.7,低于 70% 待定由人工处理。"},{"scope":"system","topic":"S1","type":"judge","q":"某项 KPI 当月没有数据来源,系统应按 0 分计入加权得分。","a":false,"exp":"错。制度写「缺失值标 N/A 或待核,不计零」,权重归一化后再算。"},{"scope":"system","topic":"S2","type":"judge","q":"季度 OKR 的得分直接决定当月绩效工资。","a":false,"exp":"错。季度 OKR 公开自评、不挂钱,只作季度档位上下调的参考;决定 15% 绩效工资的是月度 KPI。"},{"scope":"system","topic":"S2","type":"single","q":"OKR 里 KR 完成度多少算「好」?","opts":["1.0","0.8~0.9","0.6~0.7","0.4 以下"],"a":2,"exp":"0.6~0.7 为好;1.0 说明目标无挑战;低于 0.4 说明超出能力。"},{"scope":"system","topic":"S3","type":"multi","q":"下列哪些属于行为项(KCI)四项?","opts":["出勤","日报有效率","交付准时","SOP 执行"],"a":[0,1,2,3],"exp":"四项全是。KCI 只做半年档位一档以内上下调,不计分不挂钱。"},{"scope":"system","topic":"S3","type":"single","q":"日报跨人相似度达到多少时触发人工核查?","opts":["0.5","0.6","0.8","1.0"],"a":2,"exp":"0.8 以上只触发人工核查,核实后才作缺记录处理,不自动作废。"},{"scope":"system","topic":"S3","type":"judge","q":"周五前没有发起周 check-in,视为本周缺一次。","a":true,"exp":"对。PMO 每周五汇总 check-in 发起率进机检。"},{"scope":"system","topic":"S4","type":"single","q":"红线触发后的正确处理是:","opts":["当月绩效自动清零","按事实、责任、严重性、复核、申诉五步处理","由打分人直接定档 I","先扣发再补程序"],"a":1,"exp":"红线是一票否决而非扣分,但须经五步处理,不自动清零;程序要件补齐前只影响当期档位与项目奖金。"},{"scope":"system","topic":"S4","type":"judge","q":"甲方投诉一经收到,本身就等于员工过错。","a":false,"exp":"错。投诉本身不直接等于过错,须经事实与责任认定。"},{"scope":"system","topic":"S5","type":"single","q":"收到打分表后,申诉表应在几个工作日内提交?","opts":["3","5","7","10"],"a":1,"exp":"5 个工作日内交申诉表;PMO 1 个工作日受理;创始人 10 个工作日内答复;申诉期间不扣发。"},{"scope":"system","topic":"S5","type":"single","q":"月度打分的节律是:","opts":["当月 25 日一次完成","次月 5 日初评、10 日复核与财务验算、15 日签字与申诉窗","次月 1 日一次完成","季度末统一打分"],"a":1,"exp":"三个节点分开,关键角色不得自报自批自发钱。"},{"scope":"system","topic":"S6","type":"single","q":"半年五档中,多数人的默认档位是:","opts":["M-","M","M+","E"],"a":1,"exp":"M = 所有核心项持续达标;不设比例、不排名、不设 O 与 F。"},{"scope":"system","topic":"S6","type":"judge","q":"连续两期 M- 会触发解除劳动合同。","a":false,"exp":"错。触发的是调岗调薪不解除(D6),且调岗前须有培训或辅导记录。"},{"scope":"system","topic":"S7","type":"single","q":"绩效扣发的四件资格中不包括:","opts":["公式","及格线","逐月评分记录","打分人口头说明"],"a":3,"exp":"四件 = 公式、及格线、逐月评分记录、民主程序+公示+签收;四件不齐视同固定工资不得扣发。"},{"scope":"system","topic":"S7","type":"judge","q":"新岗位或新账号的前三个月不考核 GMV。","a":true,"exp":"对。新人前三个月走 C 路线(探索期里程碑 + 学习目标)。"},{"scope":"system","topic":"S7","type":"red","q":"你是打分人,本月你给自己所在线的所有人打了分,并直接把比例填进了工资表。","a":"违规","exp":"🔴 关键角色不得自报自批自发钱:初评→另一名有权限者复核→财务验算→员工签字→审批归档。"},{"scope":"system","topic":"S7","type":"red","q":"员工签了打分表,你把签字理解为「员工同意本月比例」并据此关闭申诉窗。","a":"违规","exp":"🔴 签字表示知悉,不表示同意;申诉窗自收到打分表起 5 个工作日,不因签字关闭。"},{"scope":"datagate","topic":"G0","type":"single","q":"以下哪类内容属于「红类·绝对不发给 AI」?","opts":["公开政策新闻","脱敏后的工单流程","客户姓名与手机号","表达与格式问题"],"a":2,"exp":"红类:客户姓名手机号身份证住址、未公开经营数据、网络拓扑账号口令、未发红头文件、合同报价底价。"},{"scope":"datagate","topic":"G0","type":"multi","q":"脱敏三步包括:","opts":["换人名为客户 A","换数字为 X","换专名为 A 网格","把回填交给 AI 完成"],"a":[0,1,2],"exp":"回填不能交给 AI,由本人回填。"},{"scope":"datagate","topic":"G0","type":"judge","q":"活动方案属于黄类,脱敏后可以发给 AI。","a":true,"exp":"对。黄类 = 工单流程、活动方案、个人记录、会议分工,脱敏后可发。"},{"scope":"datagate","topic":"G0","type":"single","q":"「一句话安全口令」不包括:","opts":["不索要原值","待填不估算","不出现推测数字人名单位","可用行业均值替代缺失数据"],"a":3,"exp":"缺数据写「待填」,不估算、不用行业均值冒充。"},{"scope":"datagate","topic":"G0","type":"red","q":"为了让 AI 把话术改得更精准,你把直播客资表(含手机号)直接粘进了对话框。","a":"违规","exp":"🔴 真实手机号不进任何外部环境(微信云端、AI 对话、爬虫);客资只进指定系统。"},{"scope":"datagate","topic":"G0","type":"red","q":"AI 生成的周报里有一个你没核过的「留资 312 条」,你原样发给了甲方。","a":"违规","exp":"🔴 三条红线之一:不编数据;AI 生成内容由署名者负全责。"},{"scope":"datagate","topic":"G0","type":"judge","q":"用 AI 整理周报时,把团队成果写成个人成果没有问题,反正是 AI 写的。","a":false,"exp":"错。三条红线:不编数据 / 不把团队成果写成个人 / AI 生成署名者负全责。"},{"scope":"datagate","topic":"G0","type":"single","q":"判断一段内容能不能发给 AI,先做的第一件事是:","opts":["看字数","按红黄绿三类分级","看 AI 工具是不是国产","问同事"],"a":1,"exp":"第 0 章数据闸:先分级(红/黄/绿),黄类脱敏后发,红类绝对不发。"}],"exam20":[{"n":1,"veto":true,"type":"single","q":"关于开播前的合规审核,下列说法正确的是:","opts":["属公司内部管理动作,做不做由直播间自行决定","是审核值班岗的权限,该岗有权叫停","是法定义务,法条写的是「应当建立」,且记录须留存","平台要求做,法律没有要求"],"a":2,"exp":"🔴 令 117 号第三十条:直播间运营者<b>应当<\/b>建立健全事前合规审核机制。「有权叫停」是内部管理动作,「应当建立」是法定义务。<b>答 A 或 B 即一票否决。<\/b>"},{"n":2,"type":"single","q":"《直播电商监督管理办法》(令第 117 号)的公布与施行时间是:","opts":["2025-12-18 公布,2026-01-01 施行","2025-12-18 公布,2026-02-01 施行","2026-02-01 公布,2026-03-20 施行","2026-03-20 公布,2026-06-01 施行"],"a":1,"exp":"2025-12-18 公布,<b>2026-02-01 施行<\/b>。2026-03-20 是令 120 号。"},{"n":3,"type":"single","q":"主播身份向平台报送的频次要求是:","opts":["入职时报一次","每月一次","每次直播前","仅更换主播时"],"a":2,"exp":"第 28 条:<b>每次直播前<\/b>报送。"},{"n":4,"type":"single","q":"事前合规审核的签字件与配套记录,保存期限是:","opts":["不少于 1 年","不少于 2 年"   return {scope:'pbz',type:'single',q:'下列哪一项是播前闸「一票否决」项?(时间窗:'+vi.win+')',opts:opts.map(x=>x.item+'('+x.win+')'),a:opts.indexOf(vi),exp:'一票否决项:'+vi.item+'。标准:'+vi.std+(vi.law?' 依据:'+vi.law:'')+'。其余三项级别为限期整改或常规。'};});}

 h+='<div class="card"><h2>播前闸 V3.1 · 一票否决 44 项</h2><p class="muted">按时间窗分组,自测页有 10 题随机速测。</p>';

function vQuiz(){if(quizState)return quizRunning();const sets=quizSets();let h='<div class="card"><h2>选一套题</h2><p class="muted">通过 = 分数 ≥ 及格线 且 红线/否决题零错。作答记录只存本机;通过后到「记录」页带入多维表格。</p>';

function startQuiz(setId){const s=quizSets().find(x=>x.set===setId);const items=s.items||pbzItems();quizState={set:s,items:items,idx:0,answers:items.map(()=>null),done:false};render();}
function quizRunning(){const st=quizState,q=st.items[st.idx];if(st.done)return quizResult();
 let h='<div class="card"><div class="row" style="justify-content:space-between"><span class="muted">'+esc(st.set.label)+'</span><span class="muted">'+(st.idx+1)+'/'+st.items.length+'</span></div><div class="bar" style="margin:8px 0"><i style="width:'+Math.round((st.idx)/st.items.length*100)+'%"></i></div>';
 h+='<p>'+(q.type==='red'||q.veto?'<span class="tag red">'+(q.veto?'否决题':'红线情景')+'</span>':'<span class="tag">'+({single:'单选',multi:'多选',judge:'判断'}[q.type]||q.type)+'</span>')+' '+q.q+'</p>';
 const ans=st.answers[st.idx];const opts=q.type==='judge'?['对','错']:(q.type==='red'?['合规','违规']:q.opts);
 opts.forEach((o,i)=>{const sel=q.type==='multi'?(ans||[]).includes(i):ans===i;h+='<span class="opt '+(sel?'sel':'')+'" data-act="pick" data-i="'+i+'">'+esc(String.fromCharCode(65+i))+'. '+o+'</span>';});
 h+='<div class="row" style="margin-top:10px;justify-content:space-between"><span class="btn s" data-act="prev" '+(st.idx===0?'disabled':'')+'>上一题</span><span class="btn p" data-act="next">'+(st.idx===st.items.length-1?'交卷':'下一题')+'</span></div><p class="muted" style="margin-top:8px"><span data-act="quit" class="btn s" style="font-size:13px;padding:5px 10px">放弃本次</span></p></div>';return h;}
function isCorrect(q,ans){if(ans==null)return false;if(q.type==='judge')return (ans===0)===(q.a===true);if(q.type==='red')return (ans===1)===(q.a==='违规');if(q.type==='multi'){const a=(ans||[]).slice().sort().join(','),b=(q.a||[]).slice().sort().join(',');return a===b;}return ans===q.a;}
function finishQuiz(){const st=quizState;let c=0,veto=0;st.items.forEach((q,i)=>{const ok=isCorrect(q,st.answers[i]);if(ok)c++;else if(q.type==='red'||q.veto)veto++;});
 const score=Math.round(c/st.items.length*100);const pass=score>=st.set.pass&&(!st.set.vetoZero||veto===0);
 const rec={id:Date.now(),date:today(),set:st.set.set,label:st.set.label,course:st.set.course,score:score,correct:c,total:st.items.length,veto:veto,pass:pass,name:profile.name,post:profile.post};
 attempts.unshift(rec);if(attempts.length>200)attempts.length=200;save('attempts',attempts);st.done=true;st.rec=rec;render();}

 if(!r.pass)h+='<p class="muted">'+(r.veto>0&&st.set.vetoZero?'红线或否决题有错即不通过,分数再高也一样。':'分数未到及格线 '+st.set.pass+'。')+'可以立即重做。</p>';
 h+='<div class="row"><span class="btn p" data-act="start" data-set="'+r.set+'">再做一遍</span><span class="btn s" data-act="quit">返回列表</span><span class="btn" onclick="go(\'rec\')">去记录页</span></div></div>';
 h+='<div class="card"><h2>逐题回看</h2>';st.items.forEach((q,i)=>{const ok=isCorrect(q,st.answers[i]);const opts=q.type==='judge'?['对','错']:(q.type==='red'?['合规','违规']:q.opts);const ans=st.answers[i];const mine=q.type==='multi'?(ans||[]).map(x=>opts[x]).join('、'):(ans==null?'未答':opts[ans]);
  h+='<p style="margin:10px 0 4px">'+(i+1)+'. '+(ok?'<span class="tag green">对</span>':'<span class="tag red">错</span>')+' '+q.q+'</p><p class="small muted">我的答案:'+esc(mine)+'</p>'+(!ok?'<div class="exp">'+q.exp+'</div>':'');});

const KDEF=()=>({h:'',off:'',rows:[{n:'',t:'',v:'',w:''},{n:'',t:'',v:'',w:''},{n:'',t:'',v:'',w:''}]});const kload=()=>{const k=load('kpi',null)||KDEF();if(!Array.isArray(k.rows)||!k.rows.length)k.rows=KDEF().rows;return k;};
function vKpi(){const p=DATA.params;const k=kload();
 let h='<div class="card"><h2>主播直播时长取档</h2><p class="muted">达成率 =(实际直播小时 + 经批准折抵小时,折抵封顶 '+p.offset_cap+')÷ '+p.anchor_hours+'。取档 ≥100% 为 1.0,≥95% 为 0.9,≥70% 为 0.7,低于 70% 待定。</p>';
 h+='<label class="f">实际直播小时</label><input type="number" inputmode="decimal" data-act="kh" value="'+esc(k.h)+'"><label class="f">经批准折抵小时(事前批准,按实际工时)</label><input type="number" inputmode="decimal" data-act="koff" value="'+esc(k.off)+'">';
 const hh=parseFloat(k.h),off=Math.min(parseFloat(k.off)||0,p.offset_cap);if(!isNaN(hh)){const rate=(hh+off)/p.anchor_hours;const tier=rate>=p.tier_full?'1.0':rate>=p.tier_09?'0.9':rate>=p.tier_07?'0.7':'待定(人工)';h+='<div class="grid" style="margin-top:10px"><div class="stat"><b>'+Math.round(rate*1000)/10+'%</b><span>达成率(折抵计 '+off+' 小时)</span></div><div class="stat"><b>'+tier+'</b><span>建议比例</span></div></div>';}
 h+='</div>';
 h+='<div class="card"><h2>通用 KPI 加权得分</h2><p class="muted">完成比例 = 实际值 ÷ 阈值,封顶 '+p.ratio_cap+';实际值留空 = N/A 不计零,权重按其余项归一化。结果只是「建议比例」,签字后才是核定。</p><table><tr><th>指标</th><th>阈值</th><th>实际</th><th>权重%</th></tr>';
 k.rows.forEach((r,i)=>{h+='<tr><td><input data-act="kr" data-i="'+i+'" data-f="n" value="'+esc(r.n)+'" placeholder="指标名"></td><td><input type="number" inputmode="decimal" data-act="kr" data-i="'+i+'" data-f="t" value="'+esc(r.t)+'"></td><td><input type="number" inputmode="decimal" data-act="kr" data-i="'+i+'" data-f="v" value="'+esc(r.v)+'"></td><td><input type="number" inputmode="decimal" data-act="kr" data-i="'+i+'" data-f="w" value="'+esc(r.w)+'"></td></tr>';});
 h+='</table><div class="row" style="margin-top:8px"><span class="btn s" data-act="kadd">加一行</span><span class="btn s" data-act="kclr">清空</span></div>';
 const calc=kpiCalc(k.rows,p);if(calc){h+='<div class="grid" style="margin-top:10px"><div class="stat"><b>'+calc.score+'%</b><span>加权得分(有效权重 '+calc.wsum+'%)</span></div><div class="stat"><b>'+calc.tier+'</b><span>建议比例</span></div><div class="stat"><b>'+calc.na+'</b><span>N/A 项数</span></div></div><table style="margin-top:8px"><tr><th>指标</th><th>完成比例</th><th>加权</th></tr>'+calc.rows.map(r=>'<tr><td>'+esc(r.n||'—')+'</td><td>'+(r.na?'N/A':Math.round(r.ratio*100)+'%')+'</td><td>'+(r.na?'—':Math.round(r.w8*100)/100)+'</td></tr>').join('')+'</table>';}
 h+='</div>';return h;}
function kpiCalc(rows,p){const valid=rows.filter(r=>r.n||r.t||r.v||r.w);if(!valid.length)return null;let na=0,wsum=0;const out=valid.map(r=>{const t=parseFloat(r.t),v=parseFloat(r.v),w=parseFloat(r.w)||0;if(isNaN(t)||t<=0||isNaN(v)||r.v===''){na++;return {n:r.n,na:true};}wsum+=w;return {n:r.n,ratio:Math.min(v/t,p.ratio_cap),w:w};});
 if(!wsum)return {score:0,wsum:0,tier:'待定(人工)',na:na,rows:out};let s=0;out.forEach(r=>{if(!r.na){r.w8=r.ratio*r.w/wsum*100;s+=r.w8;}});const score=Math.round(s*10)/10;const rate=score/100;const tier=rate>=p.tier_full?'1.0':rate>=p.tier_09?'0.9':rate>=p.tier_07?'0.7':'待定(人工)';return {score:score,wsum:Math.round(wsum),tier:tier,na:na,rows:out};}

 return h;}
function formLink(a){if(!settings.formLearn)return null;const base=settings.formLearn.split('?')[0];const q=[['课程编号',a.course],['自测得分',a.score],['红线题错数',a.veto],['自测日期',a.date],['题集',a.label],['自评结果',a.pass?'通过':'未通过']].map(x=>'prefill_'+encodeURIComponent(x[0])+'='+encodeURIComponent(x[1])).join('&');return base+'?'+q;}
function vHelp(){const p=DATA.params;let h='<div class="card"><h2>这个台子是什么</h2><p>公司绩效制度(V1.6)的学习入口。它只做三件事:学(公共基础 + 本岗 + 播前闸 + 数据闸 + 制度)、测(通过 = 分数 + 红线零错)、算(KPI 自算器)。考评本身在飞书多维表格里跑,这里的结果要「带入表单」并经带教签字才算数。</p></div>';
 h+='<div class="card"><h2>学习怎么算通过</h2><p>'+DATA.accept.pass+'</p><table><tr><th>级</th><th>标准</th><th>能做什么</th></tr>'+DATA.accept.levels.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[1]+'</td><td>'+l[2]+'</td></tr>').join('')+'</table><h3>五条一票否决</h3><ul class="small">'+DATA.accept.veto.map(v=>'<li>'+v+'</li>').join('')+'</ul></div>';
 h+='<div class="card"><h2>考评怎么算(员工版)</h2><table class="kv"><tr><td>季度 OKR</td><td>公开自评,不挂钱,KR 0.6~0.7 为好</td></tr><tr><td>月度 KPI</td><td>决定综合薪资 '+Math.round(p.perf_share*100)+'% 的绩效工资;取档 1.0 / 0.9 / 0.7 / 待定</td></tr><tr><td>主播时长</td><td>每月 '+p.anchor_hours+' 小时;支援折抵事前批准、上限 '+p.offset_cap+' 小时</td></tr><tr><td>行为项 KCI</td><td>出勤、日报有效率、交付准时、SOP 执行;只调半年档位,不计分</td></tr><tr><td>红线</td><td>平台合规、甲方投诉或口径;五步处理,不自动清零</td></tr><tr><td>半年五档</td><td>'+DATA.tiers.map(t=>t[0]).join(' / ')+';多数人 M;不排名</td></tr><tr><td>月度节律</td><td>次月 5 日初评、10 日复核验算、15 日签字与申诉窗</td></tr><tr><td>申诉</td><td>'+p.appeal_submit_days+' 个工作日内提交,PMO '+p.appeal_accept_days+' 个工作日受理,'+p.appeal_reply_days+' 个工作日内答复;申诉期间不扣发</td></tr><tr><td>学习与考评的接口</td><td>新人前三个月、冷启期与淡季走 C 路线,学习里程碑进 KPI 表;调岗或改进期须有培训辅导记录</td></tr></table></div>';
 h+='<div class="card"><h2>隐私</h2><p class="small">所有勾选与作答只存在你这台设备的浏览器里,不上传。飞书「清理缓存」会清掉,通过后请尽快「带入表单」。托管页不含任何人名与薪酬,noindex。</p><p class="muted">来源:'+DATA.meta.sources.map(esc).join(';')+'。</p></div>';return h;}
// ---------- actions ----------
const ACT={
 name:el=>{profile.name=el.value.trim();save('profile',profile);render();},
 post:el=>{profile.post=el.value;const m=DATA.postMap.find(p=>p[0]===el.value);if(m){profile.roles=[m[1],m[2]].filter(Boolean);}save('profile',profile);render();},
 role:el=>{const id=el.dataset.id;const r=profile.roles||[];profile.roles=r.includes(id)?r.filter(x=>x!==id):r.concat([id]);save('profile',profile);render();},
 learn:el=>{if(el.checked)learned[el.dataset.id]=today();else delete learned[el.dataset.id];save('learned',learned);},
 start:el=>startQuiz(el.dataset.set),
 pick:el=>{const st=quizState,q=st.items[st.idx],i=+el.dataset.i;if(q.type==='multi'){const a=st.answers[st.idx]||[];st.answers[st.idx]=a.includes(i)?a.filter(x=>x!==i):a.concat([i]);}else st.answers[st.idx]=i;render();},
 prev:()=>{if(quizState.idx>0){quizState.idx--;render();}},
 next:()=>{const st=quizState;if(st.answers[st.idx]==null||(Array.isArray(st.answers[st.idx])&&!st.answers[st.idx].length)){toast('先作答');return;}if(st.idx<st.items.length-1){st.idx++;render();}else finishQuiz();},
 quit:()=>{quizState=null;render();},
 kh:el=>{const k=kload();k.h=el.value;save('kpi',k);render();},
 koff:el=>{const k=kload();k.off=el.value;save('kpi',k);render();},
 kr:el=>{const k=kload();if(k.rows[+el.dataset.i])k.rows[+el.dataset.i][el.dataset.f]=el.value;save('kpi',k);render();},
 kadd:()=>{const k=kload();k.rows=k.rows.concat([{n:'',t:'',v:'',w:''}]);save('kpi',k);render();},
 kclr:()=>{save('kpi',KDEF());render();},
 pack:()=>{const pack={kind:'qs_learn_pack',version:'1.0',name:profile.name,post:profile.post,roles:profile.roles,exportedAt:new Date().toISOString(),learned:learned,attempts:attempts.slice(0,50)};copyText(JSON.stringify(pack));},
 packlearn:()=>{const items=learnItems().filter(i=>learned[i.id]).map(i=>i.label+' '+learned[i.id]);copyText((profile.name||'')+' 已学清单\n'+items.join('\n'));},
 clear:()=>{if(confirm('清空本机全部学习与自测记录?此操作不可恢复。')){attempts=[];learned={};save('attempts',attempts);save('learned',learned);render();}},
 setform:el=>{settings[el.dataset.k]=el.value.trim();save('settings',settings);render();},
 toform:el=>{const a=attempts.find(x=>String(x.id)===el.dataset.id);const u=formLink(a);if(!u){toast('先在下方粘贴学习记录表单链接');return;}const w=window.open(u,'_blank');if(!w)showSheet('表单链接(已预填)',u);},
};
render();
</script>
